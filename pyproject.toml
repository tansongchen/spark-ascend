[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-ascend"
version = "0.2.0"
description = "Upstream Spark-X2.6 mixed INT4/INT8 adapter for vLLM Ascend 0.23"
requires-python = ">=3.12"

[project.entry-points."vllm.general_plugins"]
spark_int4 = "utils.register_spark:register_int4"

[tool.setuptools]
packages = ["utils"]
